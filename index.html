<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор додавання з історією</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 25px;
            background-color: #fafafa;
        }
        input {
            width: 100px;
            padding: 6px;
            font-size: 15px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        button {
            padding: 7px 16px;
            font-size: 15px;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 12px;
        }
        button:hover {
            background-color: #2c3e50;
        }
        #output {
            font-size: 18px;
            font-weight: bold;
            color: #d35400;
        }
        .history-wrapper {
            margin-top: 25px;
            max-width: 350px;
            border: 1px solid #b0bec5;
            border-radius: 8px;
            padding: 12px 18px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .history-wrapper h3 {
            margin-top: 0;
            color: #37474f;
        }
        .history-wrapper ul {
            padding-left: 20px;
            margin-bottom: 0;
        }
        .history-wrapper li {
            padding: 3px 0;
            color: #455a64;
        }
    </style>
</head>
<body>
    <h2>Простий калькулятор</h2>

    <div class="calc-box">
        <input type="text" id="num1" placeholder="Перше число">
        <span>+</span>
        <input type="text" id="num2" placeholder="Друге число">
        <span>=</span>
        <span id="output">0</span>
    </div>

    <button id="calcBtn" onclick="calculate()">Порахувати</button>

    <div class="history-wrapper">
        <h3>Історія</h3>
        <ul id="historyList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
